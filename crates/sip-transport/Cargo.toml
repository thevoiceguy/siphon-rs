[package]
name = "sip-transport"
version = "0.6.0"
edition = "2021"
license.workspace = true
description = "SIP transport layer for UDP, TCP, and TLS."
readme = "../../README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pki-types = { version = "1.2", optional = true }
arc-swap = { version = "1.7", optional = true }
# Peer-certificate identity extraction for mutual TLS (subject + SANs
# off the verified leaf). Pure Rust; only pulled in by the `tls` feature.
x509-parser = { version = "0.18", optional = true }
sha2 = { version = "0.10", optional = true }
sip-observe = { path = "../sip-observe" }
sip-hep = { path = "../sip-hep" }
sip-ratelimit = { path = "../sip-ratelimit" }
memchr = "2.7"
dashmap = { workspace = true }
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }
socket2 = "0.5"

[dev-dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
tokio-tungstenite = { version = "0.21" }
tempfile = "3"
hep-rs = { git = "https://github.com/thevoiceguy/hep-rs", branch = "main" }
# Self-signed cert generation for the swappable-TLS-config test.
# Pure Rust, no openssl dep at test time.
rcgen = "0.13"
rustls-pemfile = "2"

[features]
default = []
tls = ["tokio-rustls", "rustls", "rustls-pki-types", "arc-swap", "x509-parser", "sha2"]
ws = ["tokio-tungstenite", "futures-util"]
