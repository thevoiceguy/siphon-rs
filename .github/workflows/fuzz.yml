name: Fuzz

# Nightly, not on every pull request.
#
# A fuzzer's value is almost entirely in how long it runs, and rediscovering
# on every PR what the unit tests already cover is not worth the wall clock.
# So the run is scheduled, ten minutes a target, and the corpus persists
# between runs — each night starts where the last one left off rather than
# from the seeds again.
#
# This repository is public, so GitHub's standard runners cost it nothing and
# a nightly run is affordable where a nightly run of FCP's own CI would not
# be. The same reasoning as forge-media's fuzz workflow, which this follows.
on:
  schedule:
    # 09:00 UTC, an hour after forge-media's, so the two do not contend.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: '600'
      target:
        description: A single target to run, or blank for all of them
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz the parser and the state machines
    runs-on: ubuntu-latest
    # Ten minutes a target across twelve targets, plus the sanitizer build.
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # cargo-fuzz compiles the targets with libFuzzer and AddressSanitizer,
      # both of which need a nightly compiler.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: |
            .
            fuzz

      # The last run's corpus, so a run starts from the inputs the last one
      # found interesting rather than from the seeds. Restored by prefix: the
      # key carries the run number so each night writes a new entry, and
      # entries older than a week are evicted by GitHub on its own schedule.
      - name: Restore fuzzing corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_number }}
          restore-keys: fuzz-corpus-

      # `cargo fuzz run <target>` reads `fuzz/corpus/<target>`, which is the
      # layout these tests write. They are ordinary stable-toolchain tests and
      # are silent unless the variable is set. Without them a fuzzer spends
      # its whole run failing to invent a valid SIP message.
      - name: Generate seed corpora
        run: |
          set -eo pipefail
          SIPHON_FUZZ_SEED_DIR="$PWD/fuzz/corpus" \
            cargo test -p sip-parse -p sip-sdp --test fuzz_seeds
          find fuzz/corpus -type f | wc -l | xargs echo "corpus entries:"

      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
          ONLY: ${{ inputs.target }}
        run: |
          set -eo pipefail
          targets=$(cargo metadata --manifest-path fuzz/Cargo.toml --no-deps \
            --format-version=1 | jq -r '.packages[0].targets[]
              | select(.kind[0] == "bin") | .name' | sort)
          if [ -n "$ONLY" ]; then
            targets="$ONLY"
          fi
          failed=""
          for t in $targets; do
            echo "::group::$t"
            # `-timeout` turns a single input that hangs into a finding rather
            # than into a job that runs until the step's own deadline.
            #
            # Keep going after a failure: one target crashing should not hide
            # whether the others do, and every artifact is collected below.
            # The step still fails at the end.
            if ! cargo fuzz run "$t" -- \
                -max_total_time="$SECONDS_PER_TARGET" -timeout=25; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzzing found crashes in:$failed"
            exit 1
          fi

      # The crashing input itself, which is what makes a finding reproducible
      # (`cargo fuzz run <target> <file>`).
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
