name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_sipp:
        description: Run SIPp interop suite (requires SIPp)
        required: false
        default: "false"

permissions:
  contents: read

# Cancel superseded runs on the same PR / branch so a force-push
# doesn't leave two builds racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting and lints, on a DELIBERATELY PINNED toolchain.
  #
  # clippy gains lints in every Rust release, so an unpinned lint gate turns
  # somebody else's release into a red CI on unrelated PRs — the failure lands
  # on whoever opens the next pull request rather than on whoever changed
  # anything. Pinning makes the gate deterministic: it changes only when the
  # version below is bumped on purpose, and that bump is the commit where any
  # newly-introduced lints get dealt with.
  #
  # `build` deliberately stays on @stable: the library must keep compiling and
  # passing its tests against current Rust, and that is a signal worth having
  # break the build. Lints are a style contract; compilation is not.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --all --verbose
      - name: Test
        run: cargo test --all --verbose

  sipp-interop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sipp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SIPp
        run: sudo apt-get update && sudo apt-get install -y sip-tester
      - name: Checklist
        run: |
          echo "SIPp production checklist:"
          cat sip-testkit/sipp/PRODUCTION_CHECKLIST.md
      - name: Start siphond
        run: |
          cargo run -p siphond -- --mode full-uas --udp-bind 127.0.0.1:5060 &
          echo $! > /tmp/siphond.pid
          sleep 2
      - name: Run SIPp suite
        run: |
          cd sip-testkit/sipp
          RUN_ALL=1 SCENARIO_DELAY_MS=250 PRECHECK_OPTIONS=1 ./run_scenarios.sh 127.0.0.1 5060
      - name: Stop siphond
        if: always()
        run: |
          if [[ -f /tmp/siphond.pid ]]; then
            kill "$(cat /tmp/siphond.pid)" || true
          fi
